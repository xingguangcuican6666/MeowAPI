name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref. A stale green tick on an abandoned
# commit is worse than no tick.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  # Instruction file integrity runs first and independently. It is the cheapest
  # job and the one whose failure means the other jobs' instructions cannot be
  # trusted, so a red here is not a formatting nit.
  integrity:
    name: instruction file integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: instrcheck (Rule A + Rule B)
        run: go run ./tools/instrcheck

      # Defence in depth: assert the same invariant without the Go tool, so a
      # broken or weakened instrcheck cannot silently pass the job. Grep for the
      # codepoint ranges directly over the tracked instruction surface.
      - name: independent ASCII assertion
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if LC_ALL=C grep -nP '[\x{0400}-\x{04FF}\x{0370}-\x{03FF}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{2069}\x{E0000}-\x{E007F}]' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::forbidden codepoint range present"
              fail=1
            fi
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f" && [ "$(basename "$f")" != "LICENSE" ]; then
              echo "::error file=$f::non-ASCII byte in an instruction file"
              fail=1
            fi
          done < <(git ls-files | grep -Ei '(^|/)(AGENTS?\.md|CLAUDE\.md|GEMINI\.md)$|^\.agents/|^\.claude/|^\.cursor/|(^|/)mcp(_config)?\.json$')
          if [ "$fail" -ne 0 ]; then
            echo "instruction files violate the ASCII and invisible-character rules"
            exit 1
          fi
          echo "independent assertion: clean"

  build:
    name: build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # gofmt over the whole module. stage/ carries its own go.mod and is
      # reference material, so it is excluded rather than reformatted.
      - name: gofmt
        run: |
          set -euo pipefail
          out="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$out" ]; then
            echo "these files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: kernel imports only the standard library
        run: |
          set -euo pipefail
          self="$(go list -m)"
          # Filter to module paths (contain a dot in the first element) and drop
          # this module's own packages, which share the same shape.
          deps="$(go list -deps ./kernel \
            | grep -E '^[a-z0-9.-]+\.[a-z]{2,}/' \
            | grep -v "^${self}/" || true)"
          if [ -n "$deps" ]; then
            echo "::error::the kernel must not import third-party packages:"
            echo "$deps"
            exit 1
          fi
          echo "kernel dependency hygiene: clean"

      # tests/harness is the one non-test package under tests/, so go build ./...
      # builds it and a third-party import there would reach a production build.
      - name: harness dependency hygiene
        run: |
          set -euo pipefail
          self="$(go list -m)"
          deps="$(go list -deps ./tests/harness \
            | grep -E '^[a-z0-9.-]+\.[a-z]{2,}/' \
            | grep -v "^${self}/" || true)"
          if [ -n "$deps" ]; then
            echo "::error::tests/harness must import the kernel and the standard library only:"
            echo "$deps"
            exit 1
          fi
          echo "harness dependency hygiene: clean"

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: go test -race -count=1 -timeout 10m ./...

      # The security suite is the point of this project, so an empty result is a
      # failure rather than a pass. If the tests stop running, this goes red.
      - name: assert the security suite actually ran
        run: |
          set -uo pipefail
          # -json rather than -v, and the reason is what -v cannot answer. The text
          # form's "^--- SKIP" line is unindented only for a top-level test, so a skip
          # inside a subtest is invisible to a count built from it - measured: a subtest
          # that always skips reports its parent as PASS at column zero and the step
          # exits 0. -json emits one event per test WITH its package and its full
          # subtest path, which is also what makes an allowlist entry unforgeable by a
          # same-named test in another package.
          #
          # The exit code is deliberately not fatal here: this step's job is to name
          # what happened, and a failing run that prints nothing but "exit code 1" is
          # worse than one that lists the failures. The -race step above fails first in
          # practice, but this one still reports.
          go test -json -count=1 ./kernel/ ./tests/... ./internal/... ./tools/... \
            > /tmp/suite.json 2> /tmp/suite.err || true
          report="$(awk -f tools/ci/suite-report.awk /tmp/suite.json)"
          printf '%s\n' "$report"
          # go routes its own diagnostics into the -json stream, so stderr is empty in
          # the cases the classifier handles - a build failure, a setup failure and a
          # missing pattern all arrive as build-output plus build-fail events. What
          # stderr still carries is a failure of the tool itself, where the stream can be
          # empty or truncated and the report would read as zero tests run. Printed
          # whenever it is non-empty rather than only in that case, because an unread
          # file is a place for a diagnosis to hide.
          if [ -s /tmp/suite.err ]; then
            echo "--- go test stderr ---"
            cat /tmp/suite.err
          fi
          eval "$report"
          if [ "${BUILD_FAIL:-0}" -ne 0 ]; then
            # Reported separately from a test failure, because a build failure means no
            # test ran at all. The floor below would also fire and say "got 0", which is
            # true but is the wrong diagnosis to read first.
            echo "::error::$BUILD_FAIL package(s) failed to build, so no test in them ran"
            printf '%s\n' "${BUILD_FAILURES:-}"
            exit 1
          fi
          if [ "${FAILED:-0}" -ne 0 ]; then
            echo "::error::$FAILED test(s) failed"
            printf '%s\n' "${FAILURES:-}"
            exit 1
          fi
          # A skip is a test that declined to assert, so every skip must be either on
          # the allowlist in tools/ci/suite-report.awk or a failure. The allowlist names
          # package AND test and caps each at one skip, which closes the two ways a
          # count cap leaks: an allowlisted name skipping in a different package for a
          # different reason, and a single allowlisted name skipping hundreds of times
          # to satisfy a floor while no test passes at all.
          if [ "${UNEXPECTED:-0}" -ne 0 ]; then
            echo "::error::$UNEXPECTED test(s) skipped that are not environment-dependent"
            printf '%s\n' "${UNEXPECTED_LIST:-}"
            echo "either fix the test or add its package and name to allowed_skips in"
            echo "tools/ci/suite-report.awk with the environment reason it skips for"
            exit 1
          fi
          if [ "${EXCESS:-0}" -ne 0 ]; then
            echo "::error::$EXCESS skip(s) beyond what the allowlist permits"
            printf '%s\n' "${EXCESS_LIST:-}"
            exit 1
          fi
          # The floor has no slack, deliberately, and that is safe only because the
          # allowlist above is by name. Counted as PASS + SKIP, the total is the same
          # on a runner with a private IPv4 interface and symlinks as on one with
          # neither - the tests that skip are the same ones, and they are counted. So
          # "at least FLOOR" means every top-level test ran in every environment this
          # project supports. Adding margin here would reopen the hole the allowlist
          # closes: slack is what lets a test quietly stop asserting. If this number
          # has to move, it moves up with the suite.
          if [ $((PASSED + SKIP_TOP)) -lt 619 ]; then
            echo "::error::expected at least 619 tests to run, got $((PASSED + SKIP_TOP))"
            echo "a guard against the suite silently not running"
            exit 1
          fi

  # End-to-end: boot the kernel for real, write an audit trail, tamper with it, and
  # prove the verifier catches it. This exercises main.go, the auditfile sink and
  # the auditverify binary together, which no unit test does.
  audit-integrity:
    name: audit chain end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: boot the kernel and write a trail
        run: |
          set -euo pipefail
          go run . -text -audit /tmp/meow-audit.log >/dev/null
          go run . -text -audit /tmp/meow-audit.log >/dev/null
          echo "wrote two boots to one trail"

      - name: verify the clean trail
        run: |
          set -euo pipefail
          go run ./tools/auditverify /tmp/meow-audit.log
          go run ./tools/auditverify -json /tmp/meow-audit.log

      - name: verify the trail detects tampering
        run: |
          set -euo pipefail
          cp /tmp/meow-audit.log /tmp/tampered.log
          sed -i 's/module loaded/module EDITED/' /tmp/tampered.log
          if go run ./tools/auditverify /tmp/tampered.log; then
            echo "::error::a rewritten message was not detected"
            exit 1
          fi
          echo "tampering detected as expected"

      - name: verify the trail detects a deleted entry
        run: |
          set -euo pipefail
          # Drop a line from the middle, the cheapest way to hide an event.
          sed '5d' /tmp/meow-audit.log > /tmp/shortened.log
          if go run ./tools/auditverify /tmp/shortened.log; then
            echo "::error::a deleted entry was not detected"
            exit 1
          fi
          echo "deletion detected as expected"

      - name: the audit file is owner-only
        run: |
          set -euo pipefail
          mode="$(stat -c '%a' /tmp/meow-audit.log)"
          if [ "$mode" != "600" ]; then
            echo "::error::audit file mode is $mode, expected 600"
            exit 1
          fi
          echo "audit file mode: $mode"
